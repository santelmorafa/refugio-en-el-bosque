<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Nunca cachear el HTML: así siempre se carga la última versión (los
         assets llevan hash de contenido y se cachean sin riesgo). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Refugio en el Bosque</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <!-- Contenedor del canvas WebGL -->
    <div id="game-root"></div>

    <!-- Capa de UI (HUD, menús, pantallas). El JS la rellena. -->
    <div id="ui-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
